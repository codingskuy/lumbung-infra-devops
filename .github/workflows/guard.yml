name: Guard repo infra

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tidak ada rahasia ter-commit
        run: ci/scripts/check-no-secrets.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck skrip
        run: shellcheck deploy/backup/*.sh ci/scripts/*.sh
